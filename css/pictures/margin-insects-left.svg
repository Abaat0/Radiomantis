<svg xmlns="http://www.w3.org/2000/svg" width="130" height="1500" viewBox="0 0 130 1500" opacity="0.6">
  <!-- Margin doodles: pen sketches of insects for the left margin of the notebook background. -->
  <defs>
    <style>
      .ink { fill: none; stroke: #4d5c35; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke-width: 0.9; }
      .dot { fill: #4d5c35; stroke: none; }
      .trail { fill: none; stroke: #4d5c35; stroke-width: 1.1; stroke-dasharray: 2 6; stroke-linecap: round; }
    </style>

    <!-- Ground beetle, from above (about 70 x 90) -->
    <g id="beetle" class="ink">
      <path d="M0 -10 C 14 -10 22 6 22 24 C 22 44 12 56 0 58 C -12 56 -22 44 -22 24 C -22 6 -14 -10 0 -10 Z"/>
      <path d="M0 -10 L 0 58"/>
      <path d="M-16 -12 C -12 -22 12 -22 16 -12"/>
      <path d="M-16 -12 C -18 -6 -16 -10 -14 -10 M16 -12 C 18 -6 16 -10 14 -10"/>
      <ellipse cx="0" cy="-26" rx="8" ry="7"/>
      <path d="M-4 -32 C -10 -44 -16 -46 -22 -56"/>
      <path d="M4 -32 C 10 -44 16 -46 22 -56"/>
      <path d="M-16 -4 L -30 -12 L -36 -24"/>
      <path d="M-21 16 L -36 16 L -44 8"/>
      <path d="M-19 36 L -32 46 L -36 62"/>
      <path d="M16 -4 L 30 -12 L 36 -24"/>
      <path d="M21 16 L 36 16 L 44 8"/>
      <path d="M19 36 L 32 46 L 36 62"/>
      <path class="thin" d="M-10 4 C -12 20 -12 34 -8 46 M10 4 C 12 20 12 34 8 46"/>
    </g>

    <!-- Ant, side view (about 90 x 40) -->
    <g id="ant" class="ink">
      <ellipse cx="-30" cy="0" rx="9" ry="8"/>
      <ellipse cx="-10" cy="2" rx="11" ry="6"/>
      <circle cx="4" cy="2" r="3"/>
      <ellipse cx="24" cy="0" rx="16" ry="11"/>
      <path d="M-36 -6 C -42 -18 -50 -20 -56 -14"/>
      <path d="M-34 -7 C -38 -20 -44 -24 -50 -24"/>
      <path d="M-14 7 L -20 20 L -26 24"/>
      <path d="M-8 8 L -8 22 L -12 28"/>
      <path d="M-2 7 L 6 20 L 4 28"/>
      <circle class="dot" cx="-34" cy="-2" r="1.6"/>
    </g>

    <!-- Dragonfly, from above (about 130 x 120) -->
    <g id="dragonfly" class="ink">
      <circle cx="-4" cy="-44" r="6"/>
      <circle cx="4" cy="-44" r="6"/>
      <path d="M-6 -36 C -8 -26 8 -26 6 -36"/>
      <path d="M-5 -28 C -6 -14 6 -14 5 -28"/>
      <path d="M-3 -14 L -2 58 L 2 58 L 3 -14"/>
      <path class="thin" d="M-3 2 L 3 2 M-3 14 L 3 14 M-3 26 L 3 26 M-3 38 L 3 38 M-2 50 L 2 50"/>
      <path d="M-5 -24 C -30 -40 -62 -38 -66 -28 C -62 -20 -30 -18 -5 -20"/>
      <path d="M5 -24 C 30 -40 62 -38 66 -28 C 62 -20 30 -18 5 -20"/>
      <path d="M-5 -18 C -28 -14 -58 -2 -60 8 C -52 14 -26 0 -5 -14"/>
      <path d="M5 -18 C 28 -14 58 -2 60 8 C 52 14 26 0 5 -14"/>
      <path class="thin" d="M-12 -24 L -56 -30 M-20 -26 L -40 -34 M-12 -16 L -50 4 M-22 -12 L -36 -2"/>
      <path class="thin" d="M12 -24 L 56 -30 M20 -26 L 40 -34 M12 -16 L 50 4 M22 -12 L 36 -2"/>
    </g>

    <!-- Moth, wings open (about 110 x 80) -->
    <g id="moth" class="ink">
      <path d="M0 -22 C 4 -22 5 -12 4 0 C 3 14 2 26 0 30 C -2 26 -3 14 -4 0 C -5 -12 -4 -22 0 -22 Z"/>
      <path d="M-2 -22 C -8 -34 -16 -38 -22 -38 M2 -22 C 8 -34 16 -38 22 -38"/>
      <path class="thin" d="M-8 -31 L -10 -27 M-13 -35 L -15 -30 M-18 -37 L -19 -32 M8 -31 L 10 -27 M13 -35 L 15 -30 M18 -37 L 19 -32"/>
      <path d="M-4 -12 C -24 -30 -52 -30 -56 -14 C -58 0 -32 6 -4 2"/>
      <path d="M4 -12 C 24 -30 52 -30 56 -14 C 58 0 32 6 4 2"/>
      <path d="M-4 4 C -26 6 -42 18 -36 30 C -28 38 -12 26 -3 14"/>
      <path d="M4 4 C 26 6 42 18 36 30 C 28 38 12 26 3 14"/>
      <circle cx="-34" cy="-12" r="5"/>
      <circle cx="34" cy="-12" r="5"/>
      <path class="thin" d="M-10 -10 C -24 -16 -38 -20 -48 -18 M10 -10 C 24 -16 38 -20 48 -18"/>
    </g>

    <!-- Ladybird (about 50 x 56) -->
    <g id="ladybird" class="ink">
      <path d="M0 -14 C 18 -14 24 4 22 16 C 20 30 10 36 0 36 C -10 36 -20 30 -22 16 C -24 4 -18 -14 0 -14 Z"/>
      <path d="M0 -14 L 0 36"/>
      <path d="M-12 -14 C -10 -24 10 -24 12 -14"/>
      <circle class="dot" cx="-4" cy="-20" r="2"/>
      <circle class="dot" cx="4" cy="-20" r="2"/>
      <circle class="dot" cx="-11" cy="2" r="3.2"/>
      <circle class="dot" cx="11" cy="2" r="3.2"/>
      <circle class="dot" cx="-12" cy="20" r="2.6"/>
      <circle class="dot" cx="12" cy="20" r="2.6"/>
      <circle class="dot" cx="-4" cy="28" r="1.8"/>
      <circle class="dot" cx="4" cy="28" r="1.8"/>
      <path d="M-20 -2 L -30 -8 M-22 14 L -32 16 M-18 28 L -26 36 M20 -2 L 30 -8 M22 14 L 32 16 M18 28 L 26 36"/>
    </g>

    <!-- Bee, wings up (about 70 x 60) -->
    <g id="bee" class="ink">
      <ellipse cx="8" cy="0" rx="22" ry="13"/>
      <path class="thin" d="M0 -12 C 4 -4 4 4 0 12 M9 -13 C 13 -4 13 4 9 13 M18 -11 C 22 -4 22 4 18 11"/>
      <circle cx="-20" cy="-2" r="9"/>
      <path d="M30 0 L 36 0"/>
      <path d="M-24 -10 C -30 -20 -34 -22 -38 -20 M-20 -10 C -22 -22 -26 -26 -30 -26"/>
      <path d="M-6 -10 C -14 -36 4 -42 8 -14"/>
      <path d="M4 -12 C 6 -34 24 -36 18 -12"/>
      <path d="M-8 11 L -12 22 M0 13 L 0 24 M8 13 L 12 24"/>
    </g>

    <!-- Grasshopper, side view (about 120 x 50) -->
    <g id="hopper" class="ink">
      <path d="M-44 -6 C -40 -14 -30 -14 -26 -8 L 30 -6 C 44 -6 50 0 44 6 L -26 8 C -32 12 -42 10 -44 4 Z"/>
      <circle class="dot" cx="-38" cy="-4" r="1.8"/>
      <path d="M-40 -10 C -50 -26 -62 -30 -74 -26"/>
      <path class="thin" d="M-20 -8 L 36 -14 L 46 -4"/>
      <path d="M8 4 L 34 -22 L 50 22 L 58 24"/>
      <path class="thin" d="M20 -6 L 36 -18 M30 -10 L 40 -16"/>
      <path d="M-20 8 L -24 22 L -30 24"/>
      <path d="M-8 8 L -6 22 L -10 26"/>
    </g>
  </defs>
  <use href="#beetle" transform="translate(64 120) rotate(-14) scale(0.95)"/>
  <use href="#moth" transform="translate(64 520) rotate(8) scale(0.95)"/>
  <use href="#ant" transform="translate(66 840) rotate(76) scale(0.9)"/>
  <path class="trail" d="M70 880 C 40 930 90 960 64 1010"/>
  <use href="#hopper" transform="translate(62 1250) rotate(-62) scale(0.8)"/>
</svg>
