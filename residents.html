<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Residents - Radiomantis</title>
    <meta name="description" content="Radiomantis is an online community radio with live shows from resident DJs and selectors around the world.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Radiomantis">
    <meta property="og:title" content="Residents - Radiomantis">
    <meta property="og:description" content="Radiomantis is an online community radio with live shows from resident DJs and selectors around the world.">
    <meta property="og:url" content="https://radiomantis.com/residents">
    <meta property="og:image" content="https://radiomantis.com/css/pictures/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        html, body { background-color: #c8e476; }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="css/pictures/favicon-32.png">
    <link rel="apple-touch-icon" href="css/pictures/app-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Castoro&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#c8e476">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <img src="css/pictures/plant-background.webp" id="plant" alt="" aria-hidden="true">
    <div id="app-frame">
        
        <main id="home-view">


            <section id="info-box" class="past-shows-box">
                <h2>Residents</h2>
                
                <div class="shows-grid residents-grid">
                    <div class="show-item">
                        <img src="css/pictures/residents/beesuave.avif" alt="Bee Suave">
                        <p>Bee Suave (IT)</p>
                    </div>
                    <div class="show-item">
                        <img src="css/pictures/residents/biancah.avif" alt="biancah">
                        <p>biancah (BR)</p>
                    </div>                    
                    <div class="show-item">
                        <img src="css/pictures/residents/darbydarby.avif" alt="darbydarby">
                        <p>darbydarby (US)</p>
                    </div>
                    <div class="show-item">
                        <img src="css/pictures/residents/fodongophon.avif" alt="Fodongophon">
                        <p>Fodongophon (DE)</p>
                    </div>
                    <div class="show-item">
                        <img src="css/pictures/residents/heatsink.avif" alt="heatsink">
                        <p>heatsink (US)</p>
                    </div>
                    <div class="show-item">
                        <img src="css/pictures/residents/luca.avif" alt="luca">
                        <p>luca (BR)</p>
                    </div>
                    <div class="show-item">
                        <img src="css/pictures/residents/shweiri.avif" alt="shweiri">
                        <p>shweiri (US)</p>
                    </div>
                    <div class="show-item">
                        <img src="css/pictures/residents/sideroom.avif" alt="Sideroom">
                        <p>Sideroom (IN)</p>
                    </div>
                    <div class="show-item">
                        <img src="css/pictures/residents/splenda.avif" alt="splenda">
                        <p>splenda (US)</p>
                    </div>
                </div>
            </section>
        </main>

        <nav id="main-menu">
            <a href="/" class="nav-link">home</a>
            <a href="/schedule" class="nav-link">schedule</a>
            <a href="/residents" class="nav-link" aria-current="page">residents</a>
            <a href="/past-shows" class="nav-link">past shows</a>
            <a href="/about" class="nav-link">about us</a>
            <a target="_blank" rel="noopener" href="https://buymeacoffee.com/radiomantis" class="nav-link">donate</a>
        </nav>
    </div>

    <!-- Live chat:  -->
    <button id="chat-toggle" type="button" aria-label="Open chat" aria-expanded="false">chat</button>
    <aside id="chat-drawer" aria-hidden="true" aria-label="Live chat">
        <div id="chat-header">
            <span id="chat-title">chat</span>
            <button id="chat-close" type="button" aria-label="Close chat">&times;</button>
        </div>
        <div id="chat-status">connecting&hellip;</div>
        <div id="chat-log" role="log" aria-live="polite"></div>
        <form id="chat-form" autocomplete="off">
            <input id="chat-input" type="text" maxlength="500" placeholder="say something&hellip;" aria-label="Message">
        </form>
        <div id="chat-nick-gate">
            <form id="chat-nick-form" autocomplete="off">
                <label for="chat-nick-input">pick a name to chat</label>
                <input id="chat-nick-input" type="text" maxlength="24" placeholder="your name" aria-label="Nickname">
                <button type="submit">join</button>
            </form>
        </div>
    </aside>

    <audio id="radio-stream" src="https://radiomantis.com/listen/radiomantis/radio.mp3" preload="none"></audio>
    <script src="javascript/script.js"></script> 
</body>
</html>
